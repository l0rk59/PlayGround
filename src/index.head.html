<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Hood Grow — Monde Ouvert 🌃🌿</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e1a'/%3E%3Cpath d='M16 26V14' stroke='%233ddc74' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M16 16c-5 0-8-3-8-7 5 0 8 3 8 7z' fill='%233ddc74'/%3E%3Cpath d='M16 19c5 0 8-3 8-7-5 0-8 3-8 7z' fill='%2322b573'/%3E%3C/svg%3E">
<style>
:root{--bg:#0a0e1a;--panel:rgba(10,16,30,.93);--green:#3ddc74;--gold:#ffd166;--red:#ff4d6d;--blue:#4cc3ff;--txt:#eef4ff;--muted:#93a3c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;overscroll-behavior:none}
#scene{position:fixed;inset:0}#scene canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 6px;pointer-events:none}
.pill{pointer-events:auto;flex:1;background:var(--panel);border:1px solid rgba(61,220,116,.25);border-radius:13px;padding:7px 9px;display:flex;align-items:center;gap:7px;min-width:0;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.pill .ico{font-size:18px}.pill .v{font-weight:800;font-size:14px;white-space:nowrap}.pill .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
#stars{color:var(--gold);font-size:15px;letter-spacing:1px}
#stars.hot{animation:blink .6s infinite}
@keyframes blink{50%{opacity:.35}}
#legal{position:fixed;top:calc(62px + env(safe-area-inset-top));left:8px;z-index:19;max-width:min(92vw,430px);background:rgba(30,20,8,.9);border:1px solid rgba(255,209,102,.4);border-radius:11px;font-size:11px;line-height:1.35;padding:7px 30px 7px 9px;color:#ffe9b0}
#legal button{position:absolute;right:4px;top:4px;border:0;background:transparent;color:#ffe9b0;font-size:15px;padding:4px 8px}
#mission{position:fixed;z-index:20;left:8px;top:calc(112px + env(safe-area-inset-top));max-width:52vw;background:rgba(22,12,44,.88);border:1px solid rgba(184,146,255,.45);border-radius:11px;padding:7px 9px;font-size:11.5px}
#mission b{color:#d6bfff}
#mapWrap{position:fixed;z-index:20;right:8px;top:calc(112px + env(safe-area-inset-top));background:var(--panel);border:1px solid rgba(76,195,255,.4);border-radius:12px;padding:5px}
#minimap{display:block;width:104px;height:104px;border-radius:8px}
#status{position:fixed;z-index:20;left:8px;top:calc(292px + env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;max-width:52vw}
#distbar{position:fixed;z-index:20;left:8px;top:calc(176px + env(safe-area-inset-top));display:flex;gap:6px;align-items:center;font-size:11px;font-weight:800;
  background:rgba(8,14,24,.9);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:5px 11px}
#distbar span{white-space:nowrap}
#rentIn{color:var(--muted)}
#grade{color:var(--gold)}
#wthr{font-size:14px}
#rankbar{position:fixed;z-index:20;left:8px;top:calc(204px + env(safe-area-inset-top));width:min(300px,72vw);
  background:rgba(14,10,26,.92);border:1px solid rgba(255,209,102,.45);border-radius:13px;padding:7px 10px;
  display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ico name pay" "trk trk trk" "nx nx nx";
  gap:3px 7px;align-items:center;font-size:11.5px;cursor:pointer}
#rankIco{grid-area:ico;font-size:19px}
#rankName{grid-area:name;font-weight:900;color:var(--gold)}
#rankPay{grid-area:pay;font-size:10px;color:var(--muted);font-weight:700}
#rankTrack{grid-area:trk;height:6px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
#rankTrack i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--lime));border-radius:99px;transition:width .3s}
#rankNext{grid-area:nx;font-size:10.5px;color:var(--muted);line-height:1.35}
.tag{background:rgba(8,20,12,.9);border:1px solid rgba(61,220,116,.4);border-radius:99px;padding:6px 11px;font-size:11.5px;font-weight:800;display:none}
.tag.show{display:block}
#tagHide{border-color:var(--green)}#tagSafe{border-color:var(--gold);color:var(--gold)}
#chase{position:fixed;z-index:31;top:calc(152px + env(safe-area-inset-top));left:0;right:0;text-align:center;display:none;font-weight:900;font-size:16px;color:#fff;text-shadow:0 2px 12px #f00;animation:blink .5s infinite}
#joy{touch-action:none;position:fixed;z-index:21;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.25)}
#stick{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:99px;background:rgba(61,220,116,.55);border:1px solid rgba(61,220,116,.9)}
/* barre de commandes : colonnes compactes à droite.
   La 3e ligne (Stats + Carrière) descend sous la zone d'aide pour ne rien masquer. */
#btns{touch-action:none;position:fixed;z-index:21;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr 1fr;gap:7px;
  width:min(230px,calc(100vw - 210px))}
#btnAct{grid-column:1/-1}
.abtn{border:0;border-radius:14px;font-weight:900;color:#fff;min-width:0;min-height:59px;padding:9px 4px;font-size:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.abtn small{font-size:9px;font-weight:700;opacity:.9}
#btnAct{background:linear-gradient(180deg,#c6f16d,#22b573);color:#06210f;font-size:15px;display:none}
#btnSprint{background:rgba(76,195,255,.85)}#btnSneak{background:rgba(20,30,50,.9);border:2px solid rgba(255,255,255,.25)}
#btnSneak.on{border-color:var(--gold);color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#btnSeeds{background:rgba(80,200,120,.92);color:#06210f}
#btnLab{background:rgba(150,110,240,.92)}
#btnSpeed{background:rgba(240,170,60,.94);color:#3a2200}
#btnStats{background:rgba(60,140,220,.94)}
#btnCareer{background:rgba(30,22,8,.94);border:1px solid rgba(255,209,102,.6);color:var(--gold)}

/* ---- réglages : lignes propres, utilisables au doigt ---- */
.optsect{font-weight:900;font-size:12px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--gold);opacity:.9;margin:14px 0 6px;border-bottom:1px solid rgba(255,209,102,.25);padding-bottom:4px}
.optsect:first-child{margin-top:2px}
.optrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.optrow>span{flex:1;font-size:13px;line-height:1.25}
.optrow>span small{display:block;font-size:10px;opacity:.6;margin-top:1px}
.optctl{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.optctl b{min-width:46px;text-align:right;font-size:12.5px;color:var(--gold)}
.optslider{-webkit-appearance:none;appearance:none;width:132px;height:26px;background:transparent;touch-action:none}
.optslider::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,#3ddc74,#b892ff)}
.optslider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:99px;background:#fff;
  border:3px solid #1a1f2e;margin-top:-9px;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.optslider::-moz-range-track{height:6px;border-radius:99px;background:linear-gradient(90deg,#3ddc74,#b892ff)}
.optslider::-moz-range-thumb{width:22px;height:22px;border:3px solid #1a1f2e;border-radius:99px;background:#fff}
.optbtn{border:0;border-radius:10px;background:#243046;color:#fff;font-weight:800;font-size:12px;
  padding:9px 12px;min-width:78px;min-height:38px;cursor:pointer}
.optbtn.on{background:#3ddc74;color:#06210f}
.optbtn.off{background:#3a2030;color:#ffd9e0}
.optdanger{background:#5a1020!important}
/* daltonien : on ne se fie jamais à la couleur seule.
   Le HUD gagne des contours épais et les jauges un motif en diagonale. */
body.cb #hud,body.cb .sheet .card{--gold:#ffd400;--green:#00e5a0;--red:#ff4d6d}
body.cb .abtn,body.cb .bigbtn{border:2px solid rgba(255,255,255,.75)}
body.cb #btnSprint{background:#0057b8!important;border-color:#ffd400!important}
body.cb #btnSneak{background:#3a2a00!important;border-color:#ffd400!important}
body.cb .bigbtn{background-image:repeating-linear-gradient(45deg,
 rgba(255,255,255,.14) 0 6px,transparent 6px 12px)}
body.cb #stamFill{background-image:repeating-linear-gradient(90deg,
 rgba(0,0,0,.35) 0 4px,transparent 4px 8px)}
body.cb #prompt,body.cb #toasts .toast{border-width:2px;border-style:solid}
/* accessibilité : contraste renforcé */
body.contrast .card,body.contrast .sheet{background:#000!important;border-color:#fff!important}
body.contrast{--txt:#fff;--dim:#e6e6e6}
body.contrast .bigbtn,body.contrast .optbtn{border:2px solid #fff}
/* mode gaucher : la colonne de boutons passe à gauche */
body.lefthand #btns{left:10px;right:auto}
body.lefthand #joy{left:auto;right:14px}

#prompt{position:fixed;z-index:22;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom));background:rgba(5,10,8,.9);border:1px solid rgba(255,209,102,.5);color:#ffe9b0;border-radius:14px;padding:9px 16px;font-size:12.5px;font-weight:800;display:none;max-width:min(92vw,520px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.sheet{position:fixed;z-index:40;left:0;right:0;bottom:0;display:none;justify-content:center;background:rgba(0,0,0,.55);padding:10px}
.sheet.open{display:flex}
.card{background:#0d1626;border:1px solid rgba(61,220,116,.35);border-radius:18px;width:100%;max-width:520px;max-height:72dvh;overflow:auto;padding:13px}
.card h2{margin:2px 0 4px;font-size:17px}.card .sub{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.4}
.potgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pot{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px;font-size:11.5px;text-align:center}
.pot.sel{border-color:var(--green);box-shadow:0 0 0 2px rgba(61,220,116,.4)}
.pot .em{font-size:24px}.pot button{width:100%;margin-top:5px;border:0;border-radius:9px;padding:9px 2px;font-weight:800;font-size:11px;min-height:40px}
.growActs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.growActs button{border:0;border-radius:12px;padding:11px 2px;font-weight:800;font-size:12px;min-height:52px}
.riskbar,.patbar{height:9px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:6px 0}
.riskbar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc74,#ffd166,#ff4d6d);border-radius:99px}
.patbar i{display:block;height:100%;background:linear-gradient(90deg,#4cc3ff,#3ddc74);border-radius:99px}
.bigbtn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:900;font-size:14px;min-height:56px;margin-top:7px}
.upg{display:flex;gap:9px;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px;margin:7px 0;font-size:12px}
.upg .inf{flex:1}.upg button{border:0;border-radius:10px;padding:11px;font-weight:800;min-height:46px;min-width:90px}
#busted{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(120,0,10,.55);padding:20px}
#busted.open{display:flex}
#busted .in{background:#1a060a;border:2px solid var(--red);border-radius:18px;padding:22px;text-align:center;max-width:420px}
#toasts{position:fixed;z-index:55;top:calc(220px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.toast{background:rgba(8,14,24,.95);border:1px solid rgba(61,220,116,.45);padding:9px 15px;border-radius:99px;font-size:12.5px;font-weight:700;max-width:92vw;text-align:center}
.toast.warn{border-color:rgba(255,77,109,.65)}.toast.gold{border-color:rgba(255,209,102,.7)}
#tuto{position:fixed;z-index:50;left:8px;right:8px;bottom:calc(170px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#141b3d;border:1px solid rgba(184,146,255,.5);border-radius:14px;padding:12px;font-size:12.5px;line-height:1.5;display:none}
#tuto.open{display:block}#tuto button{margin-top:8px;border:0;border-radius:10px;padding:11px 14px;font-weight:800;min-height:46px}
#helpCard{display:none;position:fixed;z-index:52;left:8px;right:8px;bottom:calc(170px + env(safe-area-inset-bottom));background:#0d1626;border-radius:14px;padding:13px;border:1px solid rgba(255,255,255,.15);font-size:12.5px;line-height:1.55;max-width:520px;margin:0 auto}
#helpCard.open{display:block}
/* l'aide est entre le joystick (x<150) et la barre de commandes (x>158) */
#helpBtn{position:fixed;z-index:22;left:152px;bottom:calc(16px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(10,20,14,.9);color:#fff;font-size:18px}
#pauseBtn{position:fixed;z-index:22;right:8px;top:calc(234px + env(safe-area-inset-top));width:46px;height:46px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(10,20,14,.88);color:#fff;font-size:19px}
#pauseSheet .card button{margin-top:7px}
#clock{font-size:11px;font-weight:800;text-align:center;color:var(--muted);padding-top:3px}
/* barre d'endurance : juste au-dessus du joystick, sans chevaucher l'aide */
#stam{position:fixed;z-index:21;left:20px;bottom:calc(152px + env(safe-area-inset-bottom));width:96px;height:6px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
#stam i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4cc3ff,#3ddc74);border-radius:99px}
#deliv{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));background:rgba(20,10,40,.96);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;font-size:12.5px;display:none;text-align:center;max-width:92vw;line-height:1.4}
#deliv.show{display:block}
#deliv button{border:0;border-radius:10px;padding:10px 18px;font-weight:900;min-height:46px;margin:6px 4px 0}
#hoodies{display:flex;gap:8px;margin:4px 0}
#hoodies button{flex:1;border-radius:10px;min-height:44px;border:2px solid rgba(255,255,255,.3);font-size:20px}
@media (min-width:760px){#joy{left:24px}#mapWrap{top:calc(70px + env(safe-area-inset-top))}#pauseBtn{top:calc(226px + env(safe-area-inset-top))}#minimap{width:140px;height:140px}#mission{max-width:340px}#tuto,#helpCard{bottom:auto;top:230px}
 #rankbar{left:auto;right:14px;top:296px;width:290px}#status{top:auto;bottom:calc(122px + env(safe-area-inset-bottom));max-width:340px}
 }}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./vendor/three/"}}</script>
</head>
